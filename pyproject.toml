[project]
name = "math-tcs-pipeline"
version = "0.1.0"
description = "A reproducible pipeline from mathematical source text to verified Lean, with provenance at every stage."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: exercises several stages end to end; slower",
  "lean: requires a built Lean/Mathlib toolchain",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
