# Pipeline configuration. Everything here is optional.
#
# With no file at all the pipeline uses `auto`: the first agent CLI it finds on PATH,
# which authenticates against a subscription you already have. `pipeline providers`
# shows what is available on this machine.

[corpus]
# Which corpus commands act on when --corpus is not passed.
default = "demo-naturals"

[provider]
# "auto" | "claude-cli" | "codex-cli" | "gemini-cli" | "anthropic" | "replay"
default = "auto"

[provider.claude-cli]
model = "opus"

# Per-stage overrides. A stage may set a provider, a model, or both.
#
#   [stage.annotate]
#   model = "opus"          # judgement-heavy: hypothesis extraction, source fidelity
#
#   [stage.check-semantic]
#   provider = "codex-cli"  # a second opinion from a different model family
#
# Environment variables override this file:
#   PIPELINE_PROVIDER, PIPELINE_MODEL                     (all stages)
#   PIPELINE_PROVIDER_ANNOTATE, PIPELINE_MODEL_PROVE      (one stage)
