name = "mathtcs"
defaultTargets = ["DemoCorpus"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.0"

# The Lean module the demo corpus scaffolds into. The integrity checker builds it and
# reads its diagnostics and axioms back; `ProofScratch` is where a proof attempt is
# assembled, so a failed attempt can never leave the canonical module broken.
[[lean_lib]]
name = "DemoCorpus"
srcDir = "examples/demo-corpus/lean"
roots = ["DemoNaturals", "ProofScratch"]
